name: 🔄 Switch Builds

# === 补丁 0：加上 workflow_dispatch（手动运行按钮）===
# 原来只有 push / pull_request 两种触发方式。加上 workflow_dispatch 之后，
# Actions 页面右上角会出现一个 **Run workflow** 按钮 —— 编译失败要改配置重试时，
# 点一下就能重跑，不用为了触发而去改文件。
on:
  push:
  pull_request:
  workflow_dispatch:

# Global Cache Settings
env:
  GODOT_BASE_BRANCH: 3.2
  SCONS_CACHE_LIMIT: 4096

jobs:
  switch-template:
    runs-on: "ubuntu-latest"
    container: devkitpro/devkita64

    name: Template (target=release, tools=no)

    steps:
      # === 补丁 1：actions/checkout@v2 → @v4 ===
      # 2024 年起 GitHub 下线了 v1/v2 版 artifact/cache 动作，老 workflow 会直接失败。
      - uses: actions/checkout@v4

      # Upload cache on completion and check it out now
      - name: Load .scons_cache directory
        id: switch-template-cache
        # === 补丁 2：actions/cache@v2 → @v4 ===
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/.scons_cache/
          key: ${{github.job}}-${{env.GODOT_BASE_BRANCH}}-${{github.ref}}-${{github.sha}}
          restore-keys: |
            ${{github.job}}-${{env.GODOT_BASE_BRANCH}}-${{github.ref}}-${{github.sha}}
            ${{github.job}}-${{env.GODOT_BASE_BRANCH}}-${{github.ref}}
            ${{github.job}}-${{env.GODOT_BASE_BRANCH}}

      # === 补丁 3：装 scons 多条退路 ===
      # 原来只有 `pip install scons`。新版发行版有 PEP 668 限制，直接 pip 装会报错，
      # 所以这里依次尝试：已经有了 → 带 --break-system-packages → 普通装 → 走 apt。
      - name: Install scons
        run: |
          set -x
          command -v scons && scons --version && exit 0
          python3 -m pip install --break-system-packages scons \
            || python3 -m pip install scons \
            || (apt-get update && apt-get -y install scons) \
            || (sudo apt-get update && sudo apt-get -y install scons)
          scons --version

      - name: Compilation
        env:
          SCONS_CACHE: ${{github.workspace}}/.scons_cache/
        # === 补丁 4：-j2 → -j4（GitHub 的 runner 有 4 核，原来只用 2 核太慢）===
        run: |
          scons -j4 verbose=yes warnings=all werror=no platform=switch target=release tools=no

      - name: Show what was built
        if: always()
        run: |
          echo "--- bin/ ---"
          ls -la bin/ || true

      # === 补丁 5：actions/upload-artifact@v2 → @v4 ===
      - uses: actions/upload-artifact@v4
        with:
          name: switch-template
          path: bin/*
          retention-days: 14
